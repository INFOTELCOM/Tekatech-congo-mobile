name: Build Android APK

# Se déclenche à chaque envoi sur la branche principale, ou manuellement
# depuis l'onglet "Actions" du dépôt GitHub.
on:
  push:
    branches: [main, master, release/1.1.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: tekatech-congo-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
