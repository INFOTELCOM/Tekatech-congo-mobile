name: Build Android APK

# Se déclenche à chaque envoi sur la branche principale, ou manuellement
# depuis l'onglet "Actions" du dépôt GitHub.
# Android signing diagnostic trigger.
on:
  push:
    branches: [main, master, release/1.1.0]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tekatech-release.jks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la signature release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "❌ Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "❌ Secret ANDROID_KEYSTORE_PASSWORD manquant"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "❌ Secret ANDROID_KEY_ALIAS manquant"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "❌ Secret ANDROID_KEY_PASSWORD manquant"; exit 1; }

          echo "ℹ️ Base64 reçu : ${#ANDROID_KEYSTORE_BASE64} caractères"
          echo "ℹ️ Alias reçu : $ANDROID_KEY_ALIAS"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          test -s "$ANDROID_KEYSTORE_PATH" || { echo "❌ Le keystore décodé est vide"; exit 1; }
          echo "✅ Keystore décodé : $(stat -c%s "$ANDROID_KEYSTORE_PATH") octets"

          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keytool-store.err"; then
            echo "❌ ANDROID_KEYSTORE_PASSWORD est incorrect (ou le fichier n'est pas un keystore Java valide)."
            cat "$RUNNER_TEMP/keytool-store.err"
            exit 1
          fi

          echo "✅ Mot de passe du keystore accepté."
          echo "ℹ️ Alias présents dans le keystore :"
          grep -E '^[[:space:]]*[A-Za-z0-9_.-]+, ' "$RUNNER_TEMP/keystore-list.txt" | head -20 || true

          if ! keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -noprompt > /dev/null 2> "$RUNNER_TEMP/keytool-alias.err"; then
            echo "❌ ANDROID_KEY_ALIAS ne correspond à aucun alias du keystore."
            cat "$RUNNER_TEMP/keytool-alias.err"
            exit 1
          fi

          echo "✅ Alias Android valide : $ANDROID_KEY_ALIAS"
          echo "✅ Keystore release valide et accessible."

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler l'APK (release signé)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Publier l'APK dans release-assets
        if: "!contains(github.event.head_commit.message, '[release-assets]')"
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/TekaTech-Congo-Mobile-${VERSION}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release-assets/TekaTech-Congo-Mobile-${VERSION}.apk"
          git diff --cached --quiet && exit 0
          git commit -m "build: publish Android ${VERSION} APK [release-assets]"
          git push

      - name: Supprimer la clé du runner
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: tekatech-congo-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
