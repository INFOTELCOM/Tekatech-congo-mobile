name: Publish Android 1.1.1 APK for public download

on:
  push:
    branches:
      - release/1.1.0
    paths-ignore:
      - 'release-assets/**'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 1.1.1 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/tt111
          curl -L --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/INFOTELCOM/Tekatech-congo-mobile/actions/artifacts/10117984808/zip" \
            -o /tmp/tt111/artifact.zip
          unzip -o /tmp/tt111/artifact.zip -d /tmp/tt111/extracted
          APK=$(find /tmp/tt111/extracted -type f -name 'app-release.apk' -print -quit)
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/TekaTech-Congo-Mobile-1.1.1.apk
          ls -lh release-assets/TekaTech-Congo-Mobile-1.1.1.apk

      - name: Commit APK
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-assets/TekaTech-Congo-Mobile-1.1.1.apk
          if git diff --cached --quiet; then
            echo 'APK already published.'
            exit 0
          fi
          git commit -m 'chore: publish Android 1.1.1 APK'
          git push