name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dependances Flutter
        run: flutter pub get

      - name: Verifier Flutter
        run: flutter doctor -v

      - name: Installer les dependances iOS
        run: |
          cd ios
          pod install --repo-update

      - name: Compiler iOS
        run: flutter build ios --release --no-codesign

      - name: Publier le build iOS
        uses: actions/upload-artifact@v4
        with:
          name: tekatech-congo-ios-build
          path: build/ios/iphoneos/Runner.app